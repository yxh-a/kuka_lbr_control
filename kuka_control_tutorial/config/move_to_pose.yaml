# Parameters for the cartesian_move_server node.
#
# The node is launched into the robot's namespace (default `lbr`), so the
# wildcard prefix matches regardless of `robot_name`.
/**/cartesian_move_server:
  ros__parameters:
    # Frames. base_link must match the controller's robot_base_link, otherwise
    # the controller throws every setpoint away with a "wrong reference frame"
    # warning.
    base_link: "lbr_link_0"
    ee_link: "lbr_link_ee"

    # Where the cartesian_impedance_controller listens for its setpoint.
    target_frame_topic: "/lbr/cartesian_impedance_controller/target_frame"

    # Setpoint stream rate [Hz]. Well below the 200 Hz controller update rate;
    # the controller holds the last setpoint between messages.
    control_rate: 100.0

    # Motion shaping.
    default_speed: 0.05     # [m/s] used when a goal asks for speed <= 0
    max_speed: 0.25         # [m/s] goals above this are rejected
    acceleration: 0.1       # [m/s^2] ramp of the trapezoidal profile

    # How close the measured pose must get before the action succeeds, and how
    # long to wait for it. Under a soft stiffness gravity leaves a steady-state
    # offset -- raise this rather than fighting it. Measured in Gazebo at the
    # 200 N/m translational stiffness of kuka_control's gazebo_controllers.yaml,
    # an 0.08 m move settled ~0.010 m short, so 0.01 would be right on the edge.
    goal_tolerance: 0.02    # [m]
    settle_timeout: 5.0     # [s] measured on the ROS clock, so sim-time safe

    # Safety envelope, all checked before the arm moves.
    max_travel: 1.0         # [m] longest single motion
    max_reach: 0.85         # [m] from base_link origin
    min_z: 0.05             # [m] floor guard in base_link

    # If the measured pose falls this far behind the streamed setpoint the
    # motion aborts and the setpoint is dropped onto the measured pose, so the
    # impedance force decays instead of pushing into whatever blocked the arm.
    max_lag: 0.15           # [m]

    tf_timeout: 2.0         # [s] wait for the first base->ee transform

    # Wall-clock guard for a stopped ROS clock (Gazebo paused, /clock gone).
    # The motion itself is not capped in wall time, so a sim running slower
    # than real time is fine.
    clock_stall_timeout: 5.0  # [s]
    require_controller: true  # reject goals when nothing subscribes to the topic

# Parameters for the draw_trajectory_gui node.
/**/draw_trajectory_gui:
  ros__parameters:
    base_link: "lbr_link_0"
    ee_link: "lbr_link_ee"

    # Startup pose. The arm moves here smoothly on launch if it is not already
    # within home_tolerance, and the drawing square is centred on it at this
    # height. Defaults to the pose the iiwa7 spawns at in Gazebo.
    home_position: [-0.396, 0.472, 0.405]
    home_tolerance: 0.01    # [m] closer than this counts as already home

    square_size: 0.30       # [m] side of the drawing area in the XY plane
    canvas_pixels: 600      # [px] side of the canvas

    # Fraction of the speed the stroke was drawn at. 0.2 replays five times
    # slower than it was drawn.
    speed_ratio: 0.2

    approach_speed: 0.05    # [m/s] for homing and for reaching the stroke start

    # Stroke conditioning before replay.
    min_spacing: 0.002      # [m] samples closer than this are thinned out
    smooth_window: 2        # moving-average half-width, 0 disables smoothing

    # These two must match the server, and are used to shade the unreachable
    # part of the square and to slow a stroke that was drawn too fast.
    max_reach: 0.85         # [m]
    max_speed: 0.25         # [m/s]

    # The controller whose stiffness parameters the panel edits.
    controller_node: "/lbr/cartesian_impedance_controller"
    # Panel bounds. The controller enforces its own max_stiffness_* on top of
    # these, so these only decide what the panel will bother sending.
    max_stiffness_lin: 2000.0   # [N/m]
    max_stiffness_rot: 200.0    # [Nm/rad]
    # Delay after the last keystroke before a value is pushed, so typing "200"
    # does not travel through 2 and 20 on the way.
    stiffness_push_delay_ms: 400
